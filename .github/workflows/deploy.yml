name: Deploy PokéBinder PWA & OTA Updates to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apk_changed: ${{ steps.detect.outputs.apk_changed }}
      target_native_version: ${{ steps.detect.outputs.target_native_version }}
      reasons: ${{ steps.detect.outputs.reasons }}
      web_build_number: ${{ steps.detect.outputs.web_build_number }}
    steps:
      - name: Checkout repository with full git history & tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Detecteer APK-wijzigingen en bepaal versienummers
        id: detect
        run: |
          node scripts/detect-apk-changes.mjs --github-output "$GITHUB_OUTPUT"
          COMMIT_TS=$(git show -s --format=%ct HEAD 2>/dev/null || date +%s)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NOW_TS=$(date +%s)
            if [ "${NOW_TS}" -gt "${COMMIT_TS}" ]; then
              BUILD_NUM="${NOW_TS}"
            else
              BUILD_NUM="${COMMIT_TS}"
            fi
          else
            BUILD_NUM="${COMMIT_TS}"
          fi
          echo "web_build_number=${BUILD_NUM}" >> "$GITHUB_OUTPUT"

  release-apk:
    needs: detect-changes
    if: needs.detect-changes.outputs.apk_changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/android-apk.yml
    with:
      release_version: ${{ needs.detect-changes.outputs.target_native_version }}
      release_notes: "Automatische Android APK-release (${{ needs.detect-changes.outputs.reasons }}). Commit: ${{ github.event.head_commit.message }}"
      web_build_number: ${{ needs.detect-changes.outputs.web_build_number }}
    secrets: inherit

  build:
    needs: [detect-changes, release-apk]
    if: always() && needs.detect-changes.result == 'success' && (needs.release-apk.result == 'success' || needs.release-apk.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit, integration & Apps Script tests
        run: npm run test:all

      - name: Refresh physical Pokémon TCG sets catalog
        run: node scripts/sync-sets-catalog.mjs || echo "Using committed public/sets-catalog.json fallback"

      - name: Stamp release version for PWA & OTA bundle
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
          WEB_BUILD_NUMBER: ${{ needs.detect-changes.outputs.web_build_number }}
        run: |
          node scripts/write-version.mjs \
            --repo "${GITHUB_REPOSITORY}" \
            --native-version "${{ needs.detect-changes.outputs.target_native_version }}"

      - name: Build Capacitor OTA web bundle (for Android APK live updates)
        run: |
          npm run build:capacitor
          mkdir -p ota-artifact
          (cd dist/pokebinder/browser && zip -qr ../../../ota-artifact/web-bundle.zip .)

      - name: Build production PWA for GitHub Pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          npx ng build --configuration production --base-href "/${REPO_NAME}/"
          cp dist/pokebinder/browser/index.html dist/pokebinder/browser/404.html
          touch dist/pokebinder/browser/.nojekyll
          mkdir -p dist/pokebinder/browser/ota
          cp ota-artifact/web-bundle.zip dist/pokebinder/browser/ota/web-bundle.zip

      - name: Generate public version.json manifest
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
          WEB_BUILD_NUMBER: ${{ needs.detect-changes.outputs.web_build_number }}
        run: |
          node scripts/write-version.mjs \
            --manifest-only \
            --repo "${GITHUB_REPOSITORY}" \
            --native-version "${{ needs.detect-changes.outputs.target_native_version }}" \
            --bundle-file dist/pokebinder/browser/ota/web-bundle.zip \
            --out-manifest dist/pokebinder/browser/version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pokebinder/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
