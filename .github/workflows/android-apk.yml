name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'APK-versie (bijv. 1.0.0; laat leeg om package.json versie te gebruiken)'
        required: false
        default: ''
      release_notes:
        description: 'Korte release notes voor gebruikers'
        required: false
        default: 'Nieuwe Android APK-release van PokéBinder.'
  workflow_call:
    inputs:
      release_version:
        description: 'APK-versie om te bouwen (bijv. 1.0.3)'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'Release notes voor deze APK'
        required: false
        type: string
        default: ''
      web_build_number:
        description: 'Optioneel consistent buildnummer voor webVersion'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full test suite
        run: npm run test:all

      - name: Determine release version
        id: ver
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [ -n "${{ inputs.release_version }}" ]; then
            VERSION="${{ inputs.release_version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${PKG_VER}"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=$(($(date +%s) / 60))" >> "$GITHUB_OUTPUT"

      - name: Stamp version, build Capacitor bundle & sync Android
        env:
          WEB_BUILD_NUMBER: ${{ inputs.web_build_number }}
        run: |
          node scripts/write-version.mjs \
            --repo "${GITHUB_REPOSITORY}" \
            --native-version "${{ steps.ver.outputs.version }}"
          npm run build:capacitor
          npx cap sync android

      - name: Decode optional Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is ingesteld, maar ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS of ANDROID_KEY_PASSWORD ontbreekt."
              exit 1
            fi
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
            echo "Vaste Android release keystore succesvol gedecodeerd ($(wc -c < "${RUNNER_TEMP}/release.keystore") bytes)."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 ontbreekt — APK wordt ondertekend met een tijdelijke CI debug keystore. In-place APK updates op Android kunnen daardoor mislukken met 'App not installed'!"
          fi

      - name: Build Android Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionCode="${{ steps.ver.outputs.code }}" \
            -PversionName="${{ steps.ver.outputs.version }}"

      - name: Prepare fixed-name APK for direct download link
        run: |
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: ${APK_SRC}"
          cp "${APK_SRC}" pokebinder-release.apk
          ls -lh pokebinder-release.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -z "${APKSIGNER}" ]; then
            echo "::error::apksigner niet gevonden onder ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          "${APKSIGNER}" verify --verbose --print-certs pokebinder-release.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokebinder-apk-v${{ steps.ver.outputs.version }}
          path: pokebinder-release.apk

      - name: Publish GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PokéBinder v${{ steps.ver.outputs.version }}
          body: |
            ${{ inputs.release_notes || 'Nieuwe Android APK-release van PokéBinder.' }}

            ### Directe Android APK download
            Klik op **`pokebinder-release.apk`** hieronder (of gebruik altijd de vaste directe link:
            https://github.com/${{ github.repository }}/releases/latest/download/pokebinder-release.apk)
          files: |
            pokebinder-release.apk
          make_latest: true
