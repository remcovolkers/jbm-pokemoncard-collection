<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="10" y1="8" x2="118" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#192544"/>
      <stop offset="55%" stop-color="#0f1830"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <linearGradient id="holoSheen" x1="12" y1="12" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="70%" stop-color="#4edea3" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff516a" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="holoRim" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff516a"/>
      <stop offset="50%" stop-color="#ffb95f"/>
      <stop offset="100%" stop-color="#4edea3"/>
    </linearGradient>
    <linearGradient id="coralTop" x1="36" y1="22" x2="104" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="55%" stop-color="#ff405d"/>
      <stop offset="100%" stop-color="#d61c42"/>
    </linearGradient>
    <linearGradient id="iceBottom" x1="36" y1="68" x2="104" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2f6ff"/>
      <stop offset="100%" stop-color="#cad6f6"/>
    </linearGradient>
    <linearGradient id="ringMetal" x1="12" y1="0" x2="26" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64749c"/>
      <stop offset="50%" stop-color="#e5ecff"/>
      <stop offset="100%" stop-color="#475579"/>
    </linearGradient>
    <radialGradient id="coreHalo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(70 64) rotate(90) scale(24)">
      <stop offset="0%" stop-color="#4edea3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4edea3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Obsidian Vault Squircle Frame -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#holoSheen)"/>
  <rect x="5.75" y="5.75" width="116.5" height="116.5" rx="26.25" stroke="url(#holoRim)" stroke-width="3.5"/>

  <!-- Binder Spine Channel & 3 Metallic D-Rings -->
  <line x1="27.5" y1="18" x2="27.5" y2="110" stroke="#253150" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="11" y="34" width="16" height="8" rx="4" fill="url(#ringMetal)"/>
  <rect x="11" y="60" width="16" height="8" rx="4" fill="url(#ringMetal)"/>
  <rect x="11" y="86" width="16" height="8" rx="4" fill="url(#ringMetal)"/>

  <!-- Soft Emerald Vault Glow -->
  <circle cx="70" cy="64" r="24" fill="url(#coreHalo)"/>

  <!-- Top Crimson Pokéball Arc -->
  <path d="M35 60.5 A35 35 0 0 1 105 60.5 L84.5 60.5 A14.5 14.5 0 0 0 55.5 60.5 Z" fill="url(#coralTop)"/>
  <!-- Specular Highlight on Top Arc -->
  <path d="M44 47 A29 29 0 0 1 73 33.5" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Bottom Frosted Pearl Arc -->
  <path d="M105 67.5 A35 35 0 0 1 35 67.5 L55.5 67.5 A14.5 14.5 0 0 0 84.5 67.5 Z" fill="url(#iceBottom)"/>

  <!-- Center Emerald Vault Core -->
  <circle cx="70" cy="64" r="11" fill="#080e1e" stroke="#4edea3" stroke-width="3.2"/>
  <circle cx="70" cy="64" r="4.8" fill="#4edea3"/>
  <circle cx="68.5" cy="62.5" r="1.4" fill="#e8fff5"/>

  <!-- Top-Right Holo Foil Sparkle -->
  <path d="M103 18 L105.2 23.8 L111 26 L105.2 28.2 L103 34 L100.8 28.2 L95 26 L100.8 23.8 Z" fill="#ffb95f"/>
</svg>
